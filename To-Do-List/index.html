<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="todo-container">

<h1>My To-Do List</h1>
<p class="subtitle">Organize your tasks. Get things done.</p>

        <div class="input-section">

            <input
                type="text"
                id="todo-input"
                placeholder="Enter your task..."
                autocomplete="off"
            >

            <button id="add-btn">
                Add Task
            </button>

        </div>

        <div class="list-header">
            <h2>My Tasks</h2>
        </div>

        <ul id="todo-list">
            <!-- JavaScript will add tasks here -->
        </ul>

        <p class="footer-text">
            Stay focused • One task at a time
        </p>

    </div>

    <script src="app.js"></script>

</body>
</html>
